services:
  drive-osx-ui:
    build:
      context: ./drive-osx-ui
    ports:
      - "${UI_PORT:-3000}:3000"
    restart: unless-stopped
    networks:
      - app-network

  drive-osx-api:
    build:
      context: ./drive-osx-api
    env_file:
      - ./drive-osx-api/.env
    environment:
      NODE_ENV: production
      PORT: 7000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
    ports:
      - "${API_PORT:-7000}:7000"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  drive-osx-mail:
    build:
      context: ./drive-osx-mail
    env_file:
      - ./drive-osx-mail/.env
    environment:
      NODE_ENV: production
      PORT: 2525
      HOST: 0.0.0.0
      API_BASE_URL: http://drive-osx-api:7000
    ports:
      - "${SMTP_PORT:-1025}:2525"
    depends_on:
      drive-osx-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-drive}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
