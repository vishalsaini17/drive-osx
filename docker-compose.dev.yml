# Development layer, applied on top of docker-compose.yml.
#
# Selected by COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml   → development
#   COMPOSE_FILE=docker-compose.yml                          → production
#
# Each service is built from its `dev` target and runs its watch command with
# the source bind-mounted. Health checks come from the images themselves.
#
# The bind mounts below are why this cannot collapse into the base file: Compose
# has no way to omit a volume based on a variable.
services:
  drive-osx-ui:
    image: drive-osx/ui:dev
    build:
      target: dev
    volumes:
      - type: bind
        source: ./drive-osx-ui
        target: /app
        bind:
          create_host_path: true
          selinux: z
      # Keep the image's node_modules; the host's are not used inside the container.
      - /app/node_modules
    command: npm run dev
    ports: !override
      - "${UI_DEV_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: /api/v1
    depends_on:
      drive-osx-api:
        condition: service_healthy
    restart: on-failure

  # Dev convenience only: the app itself is https-only (vite.config.ts's dev
  # TLS cert), but a browser given a bare host with no scheme/port — e.g.
  # someone typing just the LAN IP out of habit — defaults to plain http on
  # port 80. Without this, that lands nowhere; with it, they land on the
  # https app instead of a confusing dead end. Production is unaffected —
  # nginx there already owns port 80 directly.
  drive-osx-ui-redirect:
    image: node:24.13-alpine
    volumes:
      - type: bind
        source: ./drive-osx-ui/scripts/dev-https-redirect.js
        target: /dev-https-redirect.js
        read_only: true
    command: node /dev-https-redirect.js
    environment:
      PORT: 80
      TARGET_HTTPS_PORT: ${UI_DEV_PORT:-3000}
    ports:
      - "${UI_DEV_REDIRECT_PORT:-80}:80"
    restart: unless-stopped

  drive-osx-api:
    image: drive-osx/api:dev
    build:
      target: dev
    environment:
      NODE_ENV: development
      PORT: 7000
      LOG_LEVEL: debug
      DATABASE_URL: postgres://${POSTGRES_USER:-drive}:${POSTGRES_PASSWORD:-drive}@postgres:5432/${POSTGRES_DB:-drive}
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-driveosx}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-driveosx-secret}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9000}
    ports: !override
      - "${API_DEV_PORT:-3001}:7000"
    volumes:
      - type: bind
        source: ./drive-osx-api
        target: /app
        bind:
          create_host_path: true
          selinux: z
      - /app/node_modules
    command: npm run dev
    restart: on-failure

  drive-osx-worker:
    image: drive-osx/api:dev
    build:
      target: dev
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgres://${POSTGRES_USER:-drive}:${POSTGRES_PASSWORD:-drive}@postgres:5432/${POSTGRES_DB:-drive}
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-driveosx}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-driveosx-secret}
      WORKER_HEALTH_PORT: 7001
    volumes:
      - type: bind
        source: ./drive-osx-api
        target: /app
        bind:
          create_host_path: true
          selinux: z
      - /app/node_modules
    command: npm run dev:worker
    restart: on-failure

  drive-osx-mail:
    image: drive-osx/mail:dev
    build:
      target: dev
    environment:
      NODE_ENV: development
      PORT: 2525
      HOST: 0.0.0.0
      API_BASE_URL: http://drive-osx-api:7000
      # Real port-25 delivery does not work from a dev machine (blocked
      # outbound, no reverse DNS, no sending reputation) — send everything to
      # Mailpit's catch-all inbox instead, by default. Every DEV_SMTP_RELAY_*
      # below defaults to Mailpit's own (safe, unauthenticated) settings, so
      # a plain `docker compose up` can never send real mail by accident.
      #
      # To deliberately test real delivery from dev instead (e.g. confirming
      # a signup's address actually reaches Gmail), set these five in the
      # *root* .env — never in this file, which is committed — then
      # `docker compose up -d drive-osx-mail`:
      #   DEV_SMTP_RELAY_HOST=smtp.email.<region>.oci.oraclecloud.com
      #   DEV_SMTP_RELAY_PORT=587
      #   DEV_SMTP_RELAY_USER=<SMTP credential username>
      #   DEV_SMTP_RELAY_PASSWORD=<SMTP credential password>
      # Then clear all four in the root .env and `docker compose up -d
      # drive-osx-mail` again to go back to Mailpit. See
      # DEV_SMTP_RELAY_HOST in .env.example for the full explanation.
      SMTP_RELAY_HOST: ${DEV_SMTP_RELAY_HOST:-mailpit}
      SMTP_RELAY_PORT: ${DEV_SMTP_RELAY_PORT:-1025}
      SMTP_RELAY_USER: ${DEV_SMTP_RELAY_USER:-}
      SMTP_RELAY_PASSWORD: ${DEV_SMTP_RELAY_PASSWORD:-}
      SMTP_RELAY_ENVELOPE_FROM: ${DEV_SMTP_RELAY_ENVELOPE_FROM:-}

    volumes:
      - type: bind
        source: ./drive-osx-mail
        target: /app
        bind:
          create_host_path: true
          selinux: z
      - /app/node_modules
    command: npm run dev
    depends_on:
      mailpit:
        condition: service_started
    restart: on-failure

  # Catches every outbound message so delivery can be tested end-to-end
  # without a real domain, MX records, or port 25 access. Web UI on 8025.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_SMTP_PORT:-1026}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    restart: unless-stopped
    networks: [app-network]

  # Datastore ports are published in development so services can also be run
  # directly on the host against this infrastructure.
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"
