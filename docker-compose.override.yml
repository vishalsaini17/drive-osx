services:
  drive-osx-ui:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - type: bind
        source: ./drive-osx-ui
        target: /app
        bind:
          create_host_path: true
          selinux: z
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - APP_URL=http://localhost:3000
      - VITE_API_BASE_URL=http://localhost:3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: on-failure

  drive-osx-api:
    build:
      dockerfile: Dockerfile.dev
    env_file:
      - ./drive-osx-api/.env
    environment:
      NODE_ENV: development
      PORT: 7000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DB_NAME: drive
      JWT_SECRET: drive-osx-secret
      API_VERSION: v1
    ports:
      - "3001:7000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - type: bind
        source: ./drive-osx-api
        target: /app
        bind:
          create_host_path: true
          selinux: z
      - /app/node_modules
    command: npm run dev
    restart: on-failure

  drive-osx-mail:
    build:
      dockerfile: Dockerfile.dev
    env_file:
      - ./drive-osx-mail/.env
    environment:
      NODE_ENV: development
      PORT: 2525
      HOST: 0.0.0.0
      API_BASE_URL: http://drive-osx-api:7000
    ports:
      - "1025:2525"
    volumes:
      - type: bind
        source: ./drive-osx-mail
        target: /app
        bind:
          create_host_path: true
          selinux: z
      - /app/node_modules
    command: npm run dev
    restart: on-failure
